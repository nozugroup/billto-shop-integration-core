name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    # The package targets PHP 7.2+. Old versions get a syntax check; PHPCompatibility runs in the test job.
    name: Syntax PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP 7.2 compatibility
        run: composer compat
      - name: Static analysis
        run: composer analyse
      - name: Tests
        run: composer test
